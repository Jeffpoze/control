name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        id: format
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # A formatting miss fails the job and attaches the exact fix as a
        # "format-patch" check, so it can be applied with `git apply`
        # without running the formatter locally.
        run: |
          dart format lib test > /dev/null
          if git diff --quiet; then exit 0; fi
          git diff --name-only | while read -r f; do
            echo "::error file=$f,title=dart format::This file needs dart format"
          done
          git diff > format.patch
          python3 - <<'PY'
          import json, os, urllib.request
          body = {
              'name': 'format-patch',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'neutral',
              'output': {
                  'title': 'Apply with: git apply',
                  'summary': 'dart format changes for this commit',
                  'text': open('format.patch').read()[:65000],
              },
          }
          req = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(body).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              },
          )
          try:
              urllib.request.urlopen(req)
          except Exception as e:
              print('Could not attach the patch:', e)
          PY
          exit 1
      - name: Analyze
        id: analyze
        continue-on-error: true
        # Machine output is turned into GitHub annotations so each issue
        # shows up on the commit and pull request, not just in the raw log.
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > analyze.txt 2>&1
          code=$?
          while IFS='|' read -r sev type rule file line col len msg; do
            case "$sev" in
              ERROR) level=error ;;
              WARNING) level=warning ;;
              INFO) level=notice ;;
              *) continue ;;
            esac
            echo "::${level} file=${file#$GITHUB_WORKSPACE/},line=${line},col=${col},title=${rule}::${msg}"
          done < analyze.txt
          [ $code -eq 0 ] || cat analyze.txt
          exit $code
      - run: flutter test --reporter github
      - name: Format and analyze must pass
        if: steps.format.outcome == 'failure' || steps.analyze.outcome == 'failure'
        run: exit 1

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=TMDB_KEY="$TMDB_KEY"
        env:
          TMDB_KEY: ${{ secrets.TMDB_TOKEN }}

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/control-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/control-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: this APK is signed with a throwaway key and won't install over the previous one."
          fi
      - run: flutter build apk --release --dart-define=TMDB_KEY="$TMDB_KEY"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: control-android
          path: build/app/outputs/flutter-apk/app-release.apk
