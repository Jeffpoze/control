name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        id: format
        continue-on-error: true
        # A formatting miss fails the job with the exact fix attached as a
        # patch (in the run's annotations), so it can be applied with
        # `git apply` without running the formatter locally.
        run: |
          dart format lib test > /dev/null
          if git diff --quiet; then exit 0; fi
          git diff --name-only | while read -r f; do
            echo "::error file=$f,title=dart format::This file needs dart format"
          done
          git diff > format.patch
          python3 - <<'PY'
          text = open('format.patch').read()
          chunk = 40000
          for i in range(0, len(text), chunk):
              part = text[i:i + chunk].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=format.patch {i // chunk + 1}::{part}')
          PY
          exit 1
      - name: Analyze
        id: analyze
        continue-on-error: true
        # Machine output is turned into GitHub annotations so each issue
        # shows up on the commit and pull request, not just in the raw log.
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > analyze.txt 2>&1
          code=$?
          while IFS='|' read -r sev type rule file line col len msg; do
            case "$sev" in
              ERROR) level=error ;;
              WARNING) level=warning ;;
              INFO) level=notice ;;
              *) continue ;;
            esac
            echo "::${level} file=${file#$GITHUB_WORKSPACE/},line=${line},col=${col},title=${rule}::${msg}"
          done < analyze.txt
          [ $code -eq 0 ] || cat analyze.txt
          exit $code
      - run: flutter test --reporter github
      - name: Format and analyze must pass
        if: steps.format.outcome == 'failure' || steps.analyze.outcome == 'failure'
        run: exit 1

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: control-android
          path: build/app/outputs/flutter-apk/app-release.apk
