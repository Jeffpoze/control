# Builds the Android app from main and attaches it to the "android-latest"
# release, so the newest APK is always one tap away on a phone.
name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/control-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/control-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: this APK is signed with a throwaway key and won't install over the previous one."
          fi
      # Each release gets its own number (1.0.N, build N) from the run count,
      # so testers can see which build they have in Android's app info.
      - run: >
          flutter build apk --release
          --build-name="1.0.${{ github.run_number }}"
          --build-number="${{ github.run_number }}"
          --dart-define=TMDB_KEY="$TMDB_KEY"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The app's TMDB key comes from a repository secret, never the code.
          TMDB_KEY: ${{ secrets.TMDB_TOKEN }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk control.apk
          git tag -f android-latest
          git push -f origin android-latest
          if ! gh release view android-latest > /dev/null 2>&1; then
            gh release create android-latest --prerelease \
              --title "Control for Android (latest build)" \
              --notes "Built automatically from main. Download control.apk on your Android phone and open it to install. Android asks once to allow installs from your browser or file manager."
          fi
          gh release upload android-latest control.apk --clobber
          gh release edit android-latest \
            --title "Control for Android (build ${{ github.run_number }})"
